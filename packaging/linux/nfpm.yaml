name: blazium-games
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: games
priority: optional
maintainer: Blazium Games <support@blazium.games>
description: |
  BlaziumLauncher. The program is /opt/blazium/games/BlaziumLauncher.
  chauffeur and blazium-cli are installed in /opt/blazium/bin.
  crash_reporter is installed next to BlaziumLauncher.
  It does not replace BlaziumHub or hub_remote.json.
vendor: Blazium Games
homepage: https://blazium.games
license: MIT
contents:
  - src: ${SOURCE_DIR}/BlaziumLauncher
    dst: /opt/blazium/games/BlaziumLauncher
    file_info:
      mode: 0755
  - src: ${SOURCE_DIR}/crash_reporter
    dst: /opt/blazium/games/crash_reporter
    file_info:
      mode: 0755
  - src: ${SOURCE_DIR}/VERSION
    dst: /opt/blazium/games/VERSION
  - src: ${SOURCE_DIR}/blazium-cli
    dst: /opt/blazium/games/blazium-cli
    file_info:
      mode: 0755
  - src: ${SOURCE_DIR}/chauffeur
    dst: /opt/blazium/bin/chauffeur
    file_info:
      mode: 0755
  - src: games.sh
    dst: /usr/bin/chauffeur
    file_info:
      mode: 0755
  - src: blazium-games.desktop
    dst: /usr/share/applications/blazium-games.desktop
  - src: blazium-games-uri.desktop
    dst: /usr/share/applications/blazium-games-uri.desktop
scripts:
  postinstall: postinst
  postremove: postrm
